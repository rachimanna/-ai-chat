name: Сборка ИИ Чат (APK + IPA)

# Каждый push в main собирает APK и IPA и публикует их в Releases.
# Приложение проверяет обновления по номеру сборки (github.run_number).

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Постоянный ключ подписи из секретов репозитория (если они заданы).
      # Нужен, чтобы новые версии ставились поверх старых без удаления.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан временным ключом"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=aichat"
            echo "storeFile=../release.jks"
          } > android/key.properties

      - name: Сборка релизного APK
        run: flutter build apk --release --build-number=$BUILD_NUMBER

      - run: cp build/app/outputs/flutter-apk/app-release.apk build/ai-chat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ai-chat-android-apk
          path: build/ai-chat.apk

  ios:
    name: iOS IPA (без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - name: Сборка iOS без подписи
        run: flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

      - name: Упаковка в IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../ai-chat-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ai-chat-ios-ipa-unsigned
          path: build/ai-chat-unsigned.ipa

  # Веб-версия на GitHub Pages: на iPhone открывается в Safari и
  # добавляется на экран «Домой» — без компьютера и без Apple ID.
  web:
    name: Веб-версия (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - name: Сборка веб-версии
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --build-number=$BUILD_NUMBER

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Публикация в Releases
    needs: [android, ios]
    # iOS может упасть — APK всё равно публикуем.
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Версия 1.0.0 (сборка ${{ github.run_number }})
          make_latest: 'true'
          body: |
            **Android:** скачайте `ai-chat.apk` на телефон и откройте его.
            **iPhone без компьютера:** откройте в Safari https://rachimanna.github.io/-ai-chat/ → «Поделиться» → «На экран „Домой“».
            **iPhone через компьютер:** скачайте `ai-chat-unsigned.ipa` и установите через Sideloadly.
          files: dist/*
